<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#008cd1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#003a5c;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Fondo con gradiente -->
    <rect width="100%" height="100%" fill="url(#grad1)"/>
    
    <!-- Elementos decorativos (círculos abstractos simulando estadio/campo) -->
    <circle cx="300" cy="200" r="180" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
    <circle cx="300" cy="200" r="120" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <rect x="150" y="50" width="300" height="300" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" rx="20"/>
    
    <!-- Icono de fútbol (estilizado) -->
    <g transform="translate(250, 150) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="32" cy="32" r="28" />
        <path d="M32 14 L44 23 L40 37 L24 37 L20 23 Z" fill="rgba(255,255,255,0.2)"/>
        <line x1="32" y1="14" x2="32" y2="4" />
        <line x1="44" y1="23" x2="53" y2="17" />
        <line x1="40" y1="37" x2="47" y2="46" />
        <line x1="24" y1="37" x2="17" y2="46" />
        <line x1="20" y1="23" x2="11" y2="17" />
    </g>
    
    <text x="300" y="320" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">C.D. JUVENTUD PARLA</text>
    <text x="300" y="350" font-family="'Inter', sans-serif" font-weight="400" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">Formación Integral</text>
</svg>
